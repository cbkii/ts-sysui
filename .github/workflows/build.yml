name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "FAILED: sdkmanager not found at $SDKMANAGER" >&2; exit 3; }
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: false
      - name: Host policy and contract checks
        shell: bash
        run: |
          bash -n tools/*.sh
          sh -n magisk/customize.sh
          sh -n magisk-visual/customize.sh
          sh -n magisk-combined/customize.sh
          bash tools/test-geometry.sh
          bash tools/test-nav-observation-contract.sh
          bash tools/test-exact-systemui-contract.sh
          bash tools/test-visual-overlay-contract.sh
          bash tools/test-proprietary-artifacts.sh
          bash tools/test-remediation-contract.sh
          bash tools/test-xposed-stubs.sh
          bash tools/test-release-tools.sh
          bash tools/test-source-manifest.sh
          bash tools/bootstrap-gradle-wrapper.sh
          bash tools/test-gradle-wrapper.sh
          ./gradlew --version
      - name: Android compile, unit tests and lint
        shell: bash
        run: |
          ./gradlew --no-daemon clean test \
            :overlay:lintDebug :visual-overlay:lintDebug :lsposed:lintDebug \
            :overlay:lintRelease :visual-overlay:lintRelease :lsposed:lintRelease \
            :overlay:assembleDebug :visual-overlay:assembleDebug :lsposed:assembleDebug \
            :overlay:assembleRelease :visual-overlay:assembleRelease :lsposed:assembleRelease
          bash tools/test-apk-contract.sh lsposed/build/outputs/apk/debug/lsposed-debug.apk
          bash tools/test-apk-contract.sh lsposed/build/outputs/apk/release/lsposed-release-unsigned.apk
      - name: Package development artefacts
        env:
          ALLOW_DEBUG_SIGNING: '1'
        run: |
          bash tools/package-release.sh debug
          bash tools/test-packaged-artifacts.sh debug
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ts18-systemui-debug
          path: dist/*
          if-no-files-found: error
