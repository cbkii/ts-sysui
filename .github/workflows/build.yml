name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Shell syntax and host policy self-test
        run: |
          bash -n tools/*.sh
          sh -n magisk/customize.sh
          bash tools/test-geometry.sh
      - name: Android compile and tests
        run: gradle --no-daemon clean test :overlay:assembleDebug :lsposed:assembleDebug
      - name: Package development artefacts
        env:
          ALLOW_DEBUG_SIGNING: '1'
        run: bash tools/package-release.sh debug
      - uses: actions/upload-artifact@v4
        with:
          name: ts18-statusbar-debug
          path: dist/*
          if-no-files-found: error
