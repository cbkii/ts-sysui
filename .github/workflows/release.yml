name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.2.0'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TS18_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'STOP: TS18_KEYSTORE_B64 secret is missing'; exit 4; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ts18-release.jks"
          chmod 600 "$RUNNER_TEMP/ts18-release.jks"
      - name: Validate and build signed release
        env:
          TS18_KEYSTORE_PATH: ${{ runner.temp }}/ts18-release.jks
          TS18_KEYSTORE_PASSWORD: ${{ secrets.TS18_KEYSTORE_PASSWORD }}
          TS18_KEY_ALIAS: ${{ secrets.TS18_KEY_ALIAS }}
          TS18_KEY_PASSWORD: ${{ secrets.TS18_KEY_PASSWORD }}
        run: |
          bash -n tools/*.sh
          sh -n magisk/customize.sh
          bash tools/test-geometry.sh
          gradle --no-daemon clean test :overlay:assembleRelease :lsposed:assembleRelease
          test -s overlay/build/outputs/apk/release/overlay-release.apk || exit 2
          test -s lsposed/build/outputs/apk/release/lsposed-release.apk || exit 2
          bash tools/package-release.sh release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          fail_on_unmatched_files: true
          files: dist/*
